# Rede de segurança: se um Cloud Agent ainda abrir PR a partir de cursor/*,
# incorpora na main sem passo manual. O fluxo desejado é push direto na main.
name: Incorporar na main

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

jobs:
  incorporar:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'cursor/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: incorporar-main-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Marcar como pronto e mesclar na main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$(gh pr view "$PR" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh pr ready "$PR"
          fi
          gh pr merge "$PR" --merge --delete-branch
